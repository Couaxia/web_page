<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Crédits | Couaxia
    </title>


    <!-- =====================================================
         CSS
    ====================================================== -->

    <link href="./css/credits.css" rel="stylesheet">
    <link href="./css/style.css" rel="stylesheet">
    <link href="./css/scroll-page.css"rel="stylesheet">

    <!-- =====================================================
         FAVICON
    ====================================================== -->

    <link rel="icon" type="image/png" href="./images/logo/Logo Transparents 2.png">

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="site-header">

        <nav class="navbar">
            <!-- =============================================
                 LOGO
            ============================================== -->  
            <a class="navbar-logo"
                href="./accueil.html"
                aria-label="Accueil Couaxia">
                <video autoplay muted loop playsinline aria-label="Logo animé de Couaxia">
                    <source src="./images/logo/Transparents.webm" type="video/webm">
                </video>
            </a>

            <!-- =============================================
                 NAVIGATION
            ============================================== -->

            <div class="navbar-links">

                <a href="./a-propos.html">👤 Mes informations</a>
                <a href="./games.html">🕹️ Jeux</a>
                <a href="./polls.html">🗳️ Sondages</a>
                <a href="./Histoire/debut_histoire.html">📖 Mon histoire</a>
                <a href="./credits.html" aria-current="page"> 🎨 Crédits</a>

            </div>

                <a href="./admin/admin.html" class="admin-access-link">⚙️ Admin</a>

            <!-- =============================================
                 THÈME
            ============================================== -->

            <button id="theme-toggle" class="theme-toggle"
                type="button" aria-label="Activer le mode nuit" title="Changer le thème">

                <span class="theme-icon" aria-hidden="true">
                    🌙
                </span>
                <span class="theme-text">
                    Mode nuit
                </span>

            </button>

        </nav>

    </header>



    <!-- =====================================================
         PAGE CRÉDITS
    ====================================================== -->

    <main>
        <section id="credits">

            <!-- =================================================
                 TITRE
            ================================================== -->

            <header class="credits-page-header">

                <h1>
                    🎨 Les Crédits
                </h1>
                <p>
                    Découvrez les artistes qui ont donné vie
                    à Couaxia, à ses compagnons et à son stream.
                </p>

            </header>



            <!-- =================================================
                 FILTRE GLOBAL
            ================================================== -->

            <div class="credits-global-filter">

                <label for="credits-category-filter">
                    🔎 Explorer la galerie
                </label>


                <div class="credits-select-wrapper">

                    <select id="credits-category-filter">

                        <!-- =====================================
                             TOUT
                        ====================================== -->

                        <option value="all">
                            Toutes les œuvres
                        </option>

                        <!-- =====================================
                             COUAXIA
                        ====================================== -->

                        <optgroup label="🌌 Couaxia">
                            <option value="couaxia">
                                Toutes les illustrations
                            </option>
                            <option value="forme-2">
                                Forme 2
                            </option>
                            <option value="forme-3">
                                Forme 3
                            </option>
                        </optgroup>

                        <!-- =====================================
                             COMPAGNONS
                        ====================================== -->

                        <optgroup label="🐉 Compagnons">
                            <option value="compagnons">
                                Tous les compagnons
                            </option>
                        </optgroup>

                        <!-- =====================================
                             STREAM
                        ====================================== -->

                        <optgroup label="🎬 Stream">
                            <option value="stream">
                                Les créations pour le stream
                            </option>
                        </optgroup>

                        <!-- =====================================
                             COLLABS
                        ====================================== -->

                        <optgroup label="🤝 Collabs">
                            <option value="collab">
                                Toutes les collabs
                            </option>
                        </optgroup>

                        <!-- =====================================
                             COUPLES
                        ====================================== -->

                        <optgroup label="💕 Couples">
                            <option value="couple">
                                Les illustrations de couple
                            </option>
                        </optgroup>



                        <!-- =====================================
                             FAN ARTS
                        ====================================== -->

                        <optgroup label="🎨 Fan Arts">
                            <option value="fanart">
                                Tous les Fan Arts
                            </option>
                        </optgroup>

                        <!-- =====================================
                             FAVORIS
                        ====================================== -->

                        <optgroup label="♥ Favoris">
                            <option value="favorites">
                                Mes œuvres favorites
                            </option>
                        </optgroup>

                    </select>

                </div>


                <!-- =============================================
                     NOMBRE DE RÉSULTATS
                ============================================== -->

                <p
                    id="credits-global-results"
                    class="credits-global-results"
                    aria-live="polite"></p>
            </div>



            <!-- =================================================
                 ŒUVRE ALÉATOIRE
            ================================================== -->

            <div class="credits-random-wrapper">

                <button id="credits-random-art" class="credits-random-button" type="button"
                    data-messages="Voyons ce que le hasard va choisir ! 🎲|Une petite œuvre au hasard ? 💜|Attention... roulement de tentacules ! 🐙🎲" >

                    <span class="credits-random-icon" aria-hidden="true">
                        🎲
                    </span>
                    <span>
                        Une œuvre au hasard
                    </span>
                </button>

            </div>



            <!-- =================================================
                 CHARGEMENT
            ================================================== -->

            <div id="credits-loading" class="credits-loading" role="status" aria-live="polite">

                <span class="credits-loading-icon" aria-hidden="true">
                    🐙
                </span>
                <p>
                    Chargement des illustrations...
                </p>

            </div>



            <!-- =================================================
                 ERREUR
            ================================================== -->

            <div id="credits-error" class="credits-error" role="alert" hidden>

                <span
                    aria-hidden="true">
                    ⚠️
                </span>

                <p id="credits-error-message">
                    Impossible de charger les illustrations.
                </p>


                <button
                    id="credits-retry"
                    type="button"
                    class="credits-retry-button"
                >
                    🔄 Réessayer
                </button>

            </div>



            <!-- =================================================
                 GALERIES GÉNÉRÉES
            ================================================== -->

            <!--
                credits-gallery.js utilisera cette zone
                pour afficher les différentes catégories.
            -->

            <div id="credits-generated-galleries"></div>



            <!-- =================================================
                 SOURCE DES CARTES
            ================================================== -->

            <!--
                AVANT :
                toutes les <article class="artist-card">
                étaient écrites ici à la main.

                MAINTENANT :
                credits-data.js remplira automatiquement
                ce conteneur depuis Supabase.

                On le garde caché car credits-gallery.js
                utilise ensuite ces cartes comme source.
            -->

            <div id="credits-card-source" hidden></div>

        </section>
    </main>



    <!-- =====================================================
         NAVIGATION VERTICALE
    ====================================================== -->

    <div class="scroll-page-controls" aria-label="Navigation verticale de la page">

        <button id="scrollTopButton" class="scroll-page-button"
            type="button" aria-label="Retourner en haut de la page" title="Retour en haut">
            ↑
        </button>
        <button id="scrollBottomButton" class="scroll-page-button"
            type="button" aria-label="Aller en bas de la page" title="Aller en bas">
            ↓
        </button>

    </div>



    <!-- =====================================================
         MASCOTTE
    ====================================================== -->

    <div class="mascotte-widget">

        <div class="mascotte-bulle" id="mascotte-bulle" role="status" aria-live="polite">
            Bienvenue dans mon univers !
        </div>
        <button class="mascotte-button" id="mascotte-button" type="button" aria-label="Parler avec Couaxia">
            <img src="./images/mascotte/YCH_Dance_V2.gif" data-idle-src="./images/mascotte/YCH_Dance_V2.gif" data-talking-src="./images/mascotte/YCH_Dance_V1.gif"
                alt="Mascotte Couaxia" class="mascotte" id="mascotte-image" draggable="false">
        </button>

    </div>



                    <!-- =====================================================
                        JAVASCRIPT
                    ====================================================== -->
                    <script src="./js/scroll-page.js"></script>
                    <script src="./js/mascotte.js"></script>
                    <script src="./js/mascotte-navigation.js"></script>
                    <script src="./js/protection.js"></script>
                    <script src="./js/credits-data.js"></script>
                    <script src="./js/credits-gallery.js"></script>
                    <script src="./js/gallery-random.js"></script>
                    <script src="./js/gallery-favorites.js"></script>
                    <script src="./js/sensitive-gallery.js"></script>
                    <script src="./js/watermark.js"></script>
                    <script src="./js/artist.js"></script>
                    <script src="./js/theme.js"></script>


</body>

</html>
